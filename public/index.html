<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3a5c" />
    <meta name="description" content="Christian's Summer School - Interactive spelling and writing app" />
    <title>Christian's Summer School</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
      }
      #root {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,0.08);
      }

      /* CSS variable overrides to match Claude design system */
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f5;
        --color-background-tertiary: #ebebeb;
        --color-background-success: #eaf3de;
        --color-background-danger: #fcebeb;
        --color-background-warning: #faeeda;
        --color-background-info: #e6f1fb;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #555555;
        --color-text-tertiary: #888888;
        --color-text-success: #3b6d11;
        --color-text-danger: #a32d2d;
        --color-text-warning: #854f0b;
        --color-text-info: #185fa5;
        --color-border-tertiary: rgba(0,0,0,0.1);
        --color-border-secondary: rgba(0,0,0,0.2);
        --color-border-primary: rgba(0,0,0,0.3);
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-serif: Georgia, serif;
        --font-mono: 'Courier New', monospace;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #1a1a1a; }
        #root { background: #111111; box-shadow: none; }
        :root {
          --color-background-primary: #1e1e1e;
          --color-background-secondary: #2a2a2a;
          --color-background-tertiary: #333333;
          --color-background-success: #1a2e0a;
          --color-background-danger: #2e0a0a;
          --color-background-warning: #2e1f0a;
          --color-background-info: #0a1e2e;
          --color-text-primary: #f0f0f0;
          --color-text-secondary: #aaaaaa;
          --color-text-tertiary: #777777;
          --color-text-success: #97c459;
          --color-text-danger: #f09595;
          --color-text-warning: #fac775;
          --color-text-info: #85b7eb;
          --color-border-tertiary: rgba(255,255,255,0.1);
          --color-border-secondary: rgba(255,255,255,0.2);
          --color-border-primary: rgba(255,255,255,0.3);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
