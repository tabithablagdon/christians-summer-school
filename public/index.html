<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3a5c" />
    <meta name="description" content="Christian's Summer School - Interactive spelling and writing app" />
    <title>Christian's Summer School</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #2d6a2a;
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0px,
          transparent 30px,
          rgba(0, 0, 0, 0.07) 30px,
          rgba(0, 0, 0, 0.07) 60px
        );
        min-height: 100vh;
      }
      #root {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
        box-shadow: 0 0 24px rgba(0,0,0,0.12);
        color: #1a1a1a;
      }

      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f7fa;
        --color-background-tertiary: #ebedf0;
        --color-background-success: #eaf3de;
        --color-background-danger: #fff2ec;
        --color-background-warning: #fff5ee;
        --color-background-info: #e8f0fe;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #555555;
        --color-text-tertiary: #888888;
        --color-text-success: #3b6d11;
        --color-text-danger: #c44000;
        --color-text-warning: #b84000;
        --color-text-info: #185fa5;
        --color-border-tertiary: rgba(0,0,0,0.08);
        --color-border-secondary: rgba(0,0,0,0.15);
        --color-border-primary: rgba(0,0,0,0.25);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-serif: Georgia, serif;
        --font-mono: 'Courier New', monospace;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
